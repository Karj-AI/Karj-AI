<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a13"/>
      <stop offset="1" stop-color="#1b1226"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="900" height="90" fill="url(#bg)"/>
  <g stroke="#9A8FB0" stroke-opacity="0.35" fill="none" stroke-width="1">
    <path d="M0 30 H220 L240 50 H420"/>
    <path d="M480 50 H660 L680 30 H900"/>
    <path d="M0 66 H120"/>
    <path d="M780 66 H900"/>
  </g>
  <g fill="#E8B4C8">
    <circle cx="420" cy="50" r="2.5" fill-opacity="0.7"/>
    <circle cx="480" cy="50" r="2.5" fill-opacity="0.7"/>
    <circle cx="450" cy="50" r="3">
      <animate attributeName="fill-opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect width="900" height="90" fill="url(#scan)"/>
</svg>
